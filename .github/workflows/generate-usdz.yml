name: Generate USDZ from GLB (macOS)

on:
  # Ejecutar manualmente desde GitHub Actions
  workflow_dispatch:
  # O automáticamente cuando se sube un GLB nuevo o se elimina un USDZ
  push:
    paths:
      - 'models/**'

jobs:
  convert-to-usdz:
    name: Convert GLB → USDZ
    runs-on: macos-latest  # NECESITA macOS para las herramientas de Apple USD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install usd-from-gltf
        run: npm install -g usd-from-gltf

      - name: Convert GLB files that are missing their USDZ
        run: |
          echo "🔍 Buscando archivos GLB sin su correspondiente USDZ..."
          find models -name "*.glb" | while read glbfile; do
            folder=$(dirname "$glbfile")
            basename=$(basename "$glbfile" .glb)
            usdz_file="${folder}/${basename}.usdz"
            
            if [ -f "$usdz_file" ] && [ -s "$usdz_file" ] && [ $(wc -c < "$usdz_file") -gt 1000 ]; then
              echo "⏭️  Saltar (ya existe): $usdz_file"
            else
              echo "▶️  Convirtiendo: $glbfile → $usdz_file"
              usd-from-gltf "$glbfile" "$usdz_file"
              
              if [ -f "$usdz_file" ] && [ -s "$usdz_file" ]; then
                size=$(du -sh "$usdz_file" | cut -f1)
                echo "✅ OK: $usdz_file ($size)"
              else
                echo "❌ FALLÓ: $usdz_file"
              fi
            fi
          done

      - name: Show conversion results
        run: |
          echo ""
          echo "📊 Resultados de la conversión:"
          find models -name "*.usdz" -exec sh -c 'echo "  $(du -sh "$1" | cut -f1)  $1"' _ {} \; | sort

      - name: Commit USDZ files back to repository
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add models/**/*.usdz
          
          if git diff --staged --quiet; then
            echo "ℹ️ No hay cambios en USDZ, nada que commitear."
          else
            git commit -m "auto: regenerar USDZ desde GLB [skip ci]"
            git push
            echo "✅ USDZ actualizados y subidos al repositorio."
          fi
